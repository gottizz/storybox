server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash: caché larga
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA: las rutas internas caen en index.html (quítalo si es un sitio multipágina con 404 propio)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
